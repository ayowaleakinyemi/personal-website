<!Doctype HTML>
<html>
    <head>

    <body>
        <div class="main-section" id="title">

    box-sizing: border-box;

    html, body{
        margin: 0px;
        padding: 0px;
    }


    .main-section {
        width: 100vw;
        height: 100vh;
        background-size: cover;
    }

<script>
    function MakeDreamComeTrue(){
        document.body.style.background = 'url("https://i.pinimg.com/originals/5d/9e/c1/5d9ec130d94ccf8b96c883fae2e3f4ce.gif")';
        document.getElementById("title").style.visibility = "hidden";
    }
